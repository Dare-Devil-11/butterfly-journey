<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hologram Butterfly</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#06040f;min-height:400vh;font-family:system-ui,sans-serif;overflow-x:hidden}
.section{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:40px 24px}
h1{font-size:clamp(32px,6vw,72px);font-weight:700;background:linear-gradient(135deg,#F48CB4,#d4689a,#fda4af);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1.1}
p{color:rgba(255,255,255,.4);font-size:clamp(14px,2vw,18px);margin-top:16px;max-width:480px}
.hint{position:fixed;bottom:32px;left:50%;transform:translateX(-50%);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:rgba(0,255,255,.4);pointer-events:none;animation:bob 2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(6px)}}
.line{width:1px;height:80px;background:linear-gradient(#F48CB4,transparent);margin:24px auto 0;opacity:.3}
#bf{position:fixed;inset:0;pointer-events:none;z-index:9999}
#bfs{position:absolute;width:80px;height:64px;filter:drop-shadow(0 0 14px #F48CB4) drop-shadow(0 0 4px #d4689a)}
.wl{transform-origin:60px 46px}.wr{transform-origin:60px 46px}
@keyframes fl{50%{transform:rotateY(58deg)scaleX(.35)}}
@keyframes fr{50%{transform:rotateY(-58deg)scaleX(.35)}}
@keyframes fo{to{transform:rotateY(82deg)scaleX(.18)}}
@keyframes fc{to{transform:rotateY(-82deg)scaleX(.18)}}
.fly .wl{animation:fl .4s ease-in-out infinite}
.fly .wr{animation:fr .4s ease-in-out infinite}
.land .wl{animation:fo 1.3s cubic-bezier(.16,1,.3,1)forwards}
.land .wr{animation:fc 1.3s cubic-bezier(.16,1,.3,1)forwards}
.tr{position:fixed;width:5px;height:5px;border-radius:50%;pointer-events:none;z-index:9998;animation:tf .7s ease-out forwards}
@keyframes tf{to{opacity:0;transform:scale(0)}}
</style>
</head>
<body>
<div class="section"><div><h1>Follow the flight.</h1><p>Scroll down to see where it lands.</p><div class="line"></div></div></div>
<div class="section" style="background:rgba(0,229,255,.02)"><div><h1>Dissolve.<br>Reform.</h1><p>Every transformation requires letting go of what you were.</p></div></div>
<div class="section"><div><h1>Almost there.</h1><p>Keep scrolling.</p></div></div>
<div class="section" style="background:rgba(128,0,255,.03)"><div><h1>You made it.</h1><p>Watch it land.</p></div></div>
<div class="hint">↓ scroll</div>
<div id="bf"><svg id="bfs" viewBox="0 0 120 90">
  <defs>
    <linearGradient id="hg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F48CB4"/><stop offset="35%" stop-color="#d4689a"/>
      <stop offset="65%" stop-color="#F48CB4"/><stop offset="100%" stop-color="#fda4af"/>
    </linearGradient>
    <linearGradient id="hg2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d4689a"/><stop offset="50%" stop-color="#F48CB4"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
  </defs>
  <g class="wl"><path d="M60,44 C50,25 30,8 10,12 C2,14 0,26 4,36 C8,44 24,46 44,44Z" fill="rgba(244,140,180,.22)" stroke="url(#hg)" stroke-width="2"/><path d="M60,44 C45,30 20,18 8,24" fill="none" stroke="url(#hg2)" stroke-width=".8"/><circle cx="18" cy="16" r="2.5" fill="rgba(255,255,255,.5)"/></g>
  <g class="wr"><path d="M60,44 C70,25 90,8 110,12 C118,14 120,26 116,36 C112,44 96,46 76,44Z" fill="rgba(244,140,180,.22)" stroke="url(#hg)" stroke-width="2"/><path d="M60,44 C75,30 100,18 112,24" fill="none" stroke="url(#hg2)" stroke-width=".8"/><circle cx="102" cy="16" r="2.5" fill="rgba(255,255,255,.5)"/></g>
  <g class="wl"><path d="M60,48 C44,56 22,62 12,74 C6,82 14,88 26,82 C42,74 56,60 60,48Z" fill="rgba(214,104,154,.18)" stroke="url(#hg2)" stroke-width="2"/><circle cx="16" cy="78" r="3" fill="#F48CB4" opacity=".7"/></g>
  <g class="wr"><path d="M60,48 C76,56 98,62 108,74 C114,82 106,88 94,82 C78,74 64,60 60,48Z" fill="rgba(214,104,154,.18)" stroke="url(#hg2)" stroke-width="2"/><circle cx="104" cy="78" r="3" fill="#F48CB4" opacity=".7"/></g>
  <ellipse cx="60" cy="50" rx="3" ry="20" fill="rgba(244,140,180,.65)" stroke="url(#hg)" stroke-width="1"/>
  <circle cx="60" cy="28" r="4.5" fill="rgba(244,140,180,.85)" stroke="url(#hg)" stroke-width="1.5"/>
  <path d="M59,24 Q48,12 42,8" fill="none" stroke="url(#hg)" stroke-width="1.2" stroke-linecap="round"/><circle cx="42" cy="8" r="2" fill="#fff" opacity=".8"/>
  <path d="M61,24 Q72,12 78,8" fill="none" stroke="url(#hg)" stroke-width="1.2" stroke-linecap="round"/><circle cx="78" cy="8" r="2" fill="#fff" opacity=".8"/>
</svg></div>
<script>
(function(){
  const s=document.getElementById('bfs');
  const W=[[78,8],[18,20],[65,34],[10,50],[72,64],[30,76],[50,87]];
  let lx=78,ly=8,ld=false;
  function cr(t,a,b,c,d){const u=1-t;return u*u*b+2*u*t*c+t*t*d}
  function gp(p){const n=W.length-1,g=Math.min(~~(p*n),n-1),t=p*n-g;return{x:cr(t,0,W[g][0],W[Math.min(n,g+1)][0],W[Math.min(n,g+1)][0]),y:cr(t,0,W[g][1],W[Math.min(n,g+1)][1],W[Math.min(n,g+1)][1])}}
  s.classList.add('fly');
  s.style.cssText+=`left:${W[0][0]/100*innerWidth-40}px;top:${W[0][1]/100*innerHeight-32}px`;
  window.addEventListener('scroll',()=>{
    if(ld)return;
    requestAnimationFrame(()=>{
      const dH=document.documentElement.scrollHeight-innerHeight;
      const p=gp(Math.min(dH>0?scrollY/dH:0,1));
      const x=p.x/100*innerWidth,y=p.y/100*innerHeight;
      const a=Math.atan2(p.y-ly,p.x-lx)*57.3-90;
      s.style.left=x-40+'px';s.style.top=y-32+'px';s.style.transform=`rotate(${a*.4}deg)`;
      if(Math.hypot(x-lx/100*innerWidth,y-ly/100*innerHeight)>8){
        const d=document.createElement('div');
        d.className='tr';d.style.cssText=`left:${x}px;top:${y}px;background:${Math.random()>.5?'#F48CB4':'#d4689a'}`;
        document.body.appendChild(d);setTimeout(()=>d.remove(),720);
      }
      lx=p.x;ly=p.y;
      if(p.y>=90&&!ld){ld=true;s.style.transition='left 1s,top 1s,transform .7s';s.style.transform='rotate(0)scale(.8)';setTimeout(()=>{s.classList.replace('fly','land');s.style.filter='drop-shadow(0 0 28px #F48CB4)drop-shadow(0 0 10px #fff)'},700);}
    });
  },{passive:true});
})();
</script>
</body>
</html>
